const gridHtml=()=>{const l=state.apps.map((a,i)=>[a,i]).filter(x=>!flt||x[0].cat===flt);return l.length?l.map(x=>card(x[0],x[1])).join(''):'<p class="empty">Belum ada aplikasi.</p>'+(canEdit?'<button class="btn p" data-a="start">Tambah aplikasi pertama</button>':'')};
function orient(r){(r||document).querySelectorAll('img[data-shot]').forEach(im=>{const f=()=>im.classList.toggle('port',im.naturalHeight>im.naturalWidth*1.15);if(im.complete&&im.naturalWidth)f();else im.addEventListener('load',f,{once:true})})}
function paint(r){orient(r);const q=r||document,els=[...q.querySelectorAll('[data-h]')];if(q.matches&&q.matches('[data-h]'))els.push(q);els.forEach(el=>{const p=PAL[+el.dataset.h]||PAL[0];el.style.setProperty('--c1',p[1]);el.style.setProperty('--c2',p[2])})}
function fx(){
  if(editing){fds.forEach(el=>{el.style.opacity='';el.style.transform=''});return}
  const Hh=innerHeight,nb=$('.nb'),N=nb?nb.offsetTop+nb.offsetHeight:72;
  for(const el of fds){const r=el.getBoundingClientRect(),i=cl(r.top,Hh*.98,Hh*.8),o=cl(r.bottom,N+2,N+110);el.style.opacity=Math.min(i,o).toFixed(3);el.style.transform=RM?'':'translateY('+((1-i)*40-(1-o)*14).toFixed(1)+'px) scale('+(el.classList.contains('app')?(.96+.04*i).toFixed(3):1)+')'}
}
function watch(){fds=[...document.querySelectorAll('.fd')];fx()}
let lastY=0;
function prog(){
  const b=$('.prog'),m=document.documentElement.scrollHeight-innerHeight,y=scrollY;
  if(b)b.style.transform='scaleX('+(m>0?Math.min(1,y/m):0)+')';
  if(!RM){
    const nav=$('.nav'),d=y-lastY;
    if(nav&&!editing){if(y<160||d<-2)nav.classList.remove('hide');else if(d>2)nav.classList.add('hide')}
    const k=Math.min(y,700);[$('.hero .st'),$('.hero .sa')].forEach(e=>{if(e){e.style.transform='translateY('+(k*.16).toFixed(1)+'px)';e.style.opacity=Math.max(0,1-k/760).toFixed(3)}});
  }
  lastY=y;
}
function render(){
  document.title=state.title;
  const e=editing,as=state.apps,cats=[...new Set(as.map(a=>a.cat).filter(Boolean))];
  if(flt&&!cats.includes(flt))flt='';
  const acts=canEdit?(e?'<button class="btn p" data-a="save"'+(busy?' disabled':'')+'>'+(artifact||!LOCAL?'Simpan':'Unduh file')+'</button><button class="btn" data-a="add">Aplikasi baru</button><button class="btn" data-a="cancel">Batal</button>':'<button class="btn p" data-a="edit">Edit</button>'):'';
  const nav='<div class="prog"></div><header class="nav"><div class="nb"><b class="logo">'+(e?'Mode edit':state.logo?'<img src="'+esc(state.logo)+'" alt="'+esc(state.title)+'">':esc(state.title))+'</b>'+(e?'':'<nav class="links" aria-label="Navigasi utama"><button class="btn q" data-go="apps">'+esc(state.listTitle||'Semua aplikasi')+'</button></nav>')+'<div class="right">'+(msg?'<span class="msg" role="status">'+esc(msg)+'</span>':'')+acts+'</div></div></header>';
  const sf=(k,l)=>'<input data-k="'+k+'" value="'+esc(state[k])+'" placeholder="'+l+'" aria-label="'+l+'">';
  const body=e?'<main class="panel"><div class="ed">'+sf('title','Nama situs')+'<textarea data-k="tagline" aria-label="Teks pengenalan situs" placeholder="Teks pengenalan situs (tampil di bagian atas)">'+esc(state.tagline)+'</textarea>'+sf('listTitle','Judul daftar (mis. Semua game)')+upl('logo','site',state.logo,'logo situs')+upl('cover','site',state.cover,'gambar pengenalan situs')+'</div>'+(artifact||!LOCAL?'':'<p class="mut hint"><b>Mode lokal:</b> tekan Unduh file, lalu unggah index.html yang terunduh ke hosting. Perubahan baru tayang setelah itu.</p>')+'<p class="mut hint">Gambar dipilih dari galeri HP. Jika galeri tidak terbuka, kirim gambarnya lewat chat Claude dan minta dipasang.</p><div class="grid gp">'+as.map(ecard).join('')+'</div></main><footer><textarea data-k="note" aria-label="Catatan kaki">'+esc(state.note)+'</textarea></footer>'
   :'<section class="hero" aria-label="Pengenalan situs"><div class="slide on'+(state.cover?'':' noimg')+'"><div class="st"><h1>'+esc(state.title)+'</h1>'+(String(state.tagline||'').trim()?'<p>'+esc(state.tagline).replace(/\n/g,'<br>')+'</p>':'')+'<div class="bt"><button class="btn p" data-go="apps">Lihat daftar</button></div></div>'+(state.cover?'<div class="sa"><img src="'+esc(state.cover)+'" alt=""></div>':'')+'</div></section><main><section class="sect" id="apps"><h2 class="h2 fd">'+esc(state.listTitle||'Semua aplikasi')+'</h2><div class="cats fd" role="group" aria-label="Filter kategori">'+['',...cats].map(c=>'<button class="btn" data-cat="'+esc(c)+'" aria-pressed="'+(flt===c)+'">'+(c?esc(c):'Semua')+'</button>').join('')+'</div><div class="grid">'+gridHtml()+'</div></section></main><footer>'+esc(state.note)+'</footer>';
  app.innerHTML=nav+body;
  paint();watch();prog();
}
function setF(c){flt=c;document.querySelectorAll('[data-cat]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.cat===c)));$('.grid').innerHTML=gridHtml();paint();watch();[...$('.grid').children].forEach((c,i)=>{c.style.animationDelay=(i*70)+'ms';c.classList.add('pop')})}
function openApp(i){
  const a=state.apps[i];if(!a)return;const L=safe(a.link);
  dlg.innerHTML='<div class="dc" data-h="'+hv(a)+'"><button class="btn x" data-close aria-label="Tutup">'+X+'</button><div class="dh">'+shot(a,i)+'</div><div class="db"><div class="dt"><span class="ic">'+icon(a)+'</span><div><h2 id="dt">'+esc((a.name||'').trim())+'</h2><p>'+meta(a)+'</p></div></div>'+(a.tag?'<p class="tg">'+esc(a.tag)+'</p>':'')+para(a.desc)+(L?dl(L):'<p class="mut">Tautan unduhan belum ditambahkan.</p>')+'</div></div>';
  paint(dlg);dlg.setAttribute('aria-labelledby','dt');if(!dlg.open)dlg.showModal();
}
function buildDoc(s){
  const j=JSON.stringify(s).replace(/</g,'\\u003c');
  return '<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="description" content="'+esc(s.tagline)+'"><meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#0d0f14" media="(prefers-color-scheme: dark)"><title>'+esc(s.title)+'</title>'+FONT+ICON+'<style id="css">'+$('#css').textContent+'</style></head><body><div class="bg" aria-hidden="true"><i></i><i></i><i></i></div><dialog id="dlg" aria-label="Detail aplikasi"></dialog><div id="app"></div><noscript>Aktifkan JavaScript untuk melihat halaman ini.</noscript><script type="application/json" id="data">'+j+'<\/script><script id="shell">'+$('#shell').textContent+'<\/script></body></html>';
}
function checkApps(){for(let i=0;i<state.apps.length;i++){const a=state.apps[i];if(!String(a.name).trim())return{i,k:'name',m:'Beri nama untuk setiap aplikasi.'};if(String(a.link).trim()&&!safe(a.link))return{i,k:'link',m:'Tautan harus diawali https:// atau http://'}}return null}
function downloadHtml(h){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([h],{type:'text/html'}));a.download='index.html';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}
async function save(){
  if(busy)return;
  if(!artifact&&!LOCAL){msg='Mode edit hanya untuk pemilik halaman.';render();return}
  const bad=checkApps();if(bad){setMsg(bad.m);const el=$('[data-k="'+bad.k+'"][data-i="'+bad.i+'"]');if(el){el.setAttribute('aria-invalid','true');el.scrollIntoView({block:'center'});el.focus()}return}
  const html=buildDoc(state);
  if(html.length>12e6){msg='Halaman terlalu besar (maks. ±12 MB). Hapus beberapa gambar.';render();return}
  if(!artifact){downloadHtml(html);editing=false;msg='index.html terunduh. Unggah ke hosting untuk memperbarui situs.';render();return}
  busy=true;msg='Menyimpan…';render();
  try{await artifact.publish(html);busy=false;editing=false;msg='Tersimpan.';render();setTimeout(()=>{msg='';const m=$('.msg');if(m)m.remove()},2500)}
  catch(err){
    if(err&&err.code==='conflict')return;
    busy=false;msg=err&&(err.code==='not_granted'||err.code==='not_writer')?'Kamu tidak punya izin mengedit halaman ini.':'Gagal menyimpan. Coba lagi.';render();
  }
}
app.addEventListener('input',ev=>{const t=ev.target,k=t.dataset.k;if(!k)return;t.removeAttribute('aria-invalid');const i=t.dataset.i;if(i===undefined)state[k]=t.value;else{state.apps[+i][k]=k==='hue'?+t.value:t.value;if(k==='hue'){const b=t.closest('.eb');b.dataset.h=t.value;paint(b)}}});
function setMsg(t){msg=t;let m=$('.msg');if(!m){const r=$('.right');if(!r)return;r.insertAdjacentHTML('afterbegin','<span class="msg" role="status"></span>');m=$('.msg')}m.textContent=t}
app.addEventListener('change',async ev=>{
  const t=ev.target,d=t.dataset.img;if(d===undefined||!t.files[0])return;
  const [f,i]=d.split(':'),lb=t.closest('.up'),file=t.files[0];
  if(lb)lb.classList.add('busy');setMsg('Memproses gambar…');
  try{(i==='site'?state:state.apps[+i])[f]=await pack(file,f==='icon'||f==='logo'?256:f==='cover'?1600:1000,f==='icon'||f==='logo'?'png':'jpg');msg='Gambar terpasang.'}catch(_){msg='Gambar tidak bisa dibaca. Coba foto lain (JPG atau PNG).'}
  render();
});
app.addEventListener('click',ev=>{
  const b=ev.target.closest('button');if(!b)return;
  const d=b.dataset,a=d.a;
  if(d.open!==undefined)openApp(+d.open);
  else if(d.go){const t=document.getElementById(d.go);if(t)t.scrollIntoView({behavior:SM})}
  else if(d.cat!==undefined)setF(d.cat);
  else if(d.del!==undefined){state.apps.splice(+d.del,1);render()}
  else if(d.rm!==undefined){const [f,i]=d.rm.split(':');(i==='site'?state:state.apps[+i])[f]='';render()}
  else if(a==='edit'){snap=JSON.stringify(state);editing=true;msg='';scrollTo({top:0,behavior:'auto'});render()}
  else if(a==='cancel'){state=JSON.parse(snap);editing=false;msg='';render()}
  else if(a==='add'){state.apps.unshift(newApp());render();focusName()}
  else if(a==='start'){snap=JSON.stringify(state);editing=true;msg='';state.apps.unshift(newApp());scrollTo({top:0,behavior:'auto'});render();focusName()}
  else if(a==='save')save();
});
dlg.addEventListener('click',ev=>{if(ev.target===dlg||ev.target.closest('[data-close]'))dlg.close()});
addEventListener('scroll',()=>{if(!rp){rp=1;requestAnimationFrame(()=>{rp=0;prog();fx()})}},{passive:true});
addEventListener('resize',fx);
render();
if(window.claude&&window.claude.use)(async()=>{
  try{const r=await Promise.all([window.claude.use('user'),window.claude.use('artifact')]);artifact=r[1];canEdit=!!(r[1]&&r[0]&&await r[0].canEdit())}catch(_){canEdit=false}
  if(canEdit){const r=$('.right');if(r&&!r.querySelector('[data-a]'))r.insertAdjacentHTML('beforeend','<button class="btn p" data-a="edit">Edit</button>');if(!state.apps.length)render()}
})();
</script></body></html>
