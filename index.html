const gridHtml=()=>{const l=state.apps.map((a,i)=>[a,i]).filter(x=>!flt||x[0].cat===flt);return l.length?l.map(x=>card(x[0],x[1])).join(''):'<p class="empty">Belum ada aplikasi.</p>'+(canEdit?'<button class="btn p" data-a="start">Tambah aplikasi pertama</button>':'')};

  if(editing){fds.forEach(el=>{el.style.opacity='';el.style.transform=''});return}
  const Hh=innerHeight,nb=$('.nb'),N=nb?nb.offsetTop+nb.offsetHeight:72;

let lastY=0;

async function save(){
  if(busy)return;
  if(!artifact&&!LOCAL){msg='Mode edit hanya untuk pemilik halaman.';render();return}
  const bad=checkApps();if(bad){setMsg(bad.m);const el=$('[data-k="'+bad.k+'"][data-i="'+bad.i+'"]');if(el){el.setAttribute('aria-invalid','true');el.scrollIntoView({block:'center'});el.focus()}return}

app.addEventListener('click',ev=>{
